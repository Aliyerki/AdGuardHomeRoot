name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"
  # Cuts a release by itself when AdGuardTeam publishes a new AdGuardHome. The
  # check lives in this workflow rather than a separate one because a tag pushed
  # with GITHUB_TOKEN does not trigger other workflows, so a job that only
  # tagged would never actually build anything.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  decide:
    name: Decide version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      agh: ${{ steps.decide.outputs.agh }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decide what to build
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          agh="$(gh release view --repo AdguardTeam/AdGuardHome --json tagName -q .tagName)"
          echo "Latest AdGuardHome: $agh"
          echo "agh=$agh" >>"$GITHUB_OUTPUT"

          release=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^[0-9]{8}$ ]]; then
              echo "Tag must be an 8-digit date (YYYYMMDD), got: $version" >&2
              exit 1
            fi
            release=true
          else
            version="$(date -u +%Y%m%d)"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              have=""
              [ -f update.json ] && have="$(jq -r '.adguardHome // ""' update.json)"
              if [ "$agh" = "$have" ]; then
                echo "Already released against $agh, nothing to do"
              elif gh release view "$version" >/dev/null 2>&1; then
                # a release cut earlier today would be overwritten otherwise
                echo "Release $version already exists, leaving it alone"
              else
                echo "AdGuardHome moved: ${have:-none} -> $agh"
                release=true
              fi
            fi
          fi

          echo "Version $version, release=$release"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release=$release" >>"$GITHUB_OUTPUT"

  package:
    name: Build ${{ matrix.arch }} package
    runs-on: ubuntu-latest
    needs: decide
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve archive URL
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            arm64)
              echo "archive_url=https://github.com/AdguardTeam/AdGuardHome/releases/latest/download/AdGuardHome_linux_arm64.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
            armv7)
              echo "archive_url=https://github.com/AdguardTeam/AdGuardHome/releases/latest/download/AdGuardHome_linux_armv7.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported arch: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac

      - name: Download release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache
          curl -fL "${{ steps.vars.outputs.archive_url }}" -o "cache/AdGuardHome_linux_${{ matrix.arch }}.tar.gz"

      - name: Extract archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "cache/${{ matrix.arch }}"
          tar -xzf "cache/AdGuardHome_linux_${{ matrix.arch }}.tar.gz" -C "cache/${{ matrix.arch }}"

      - name: Stage package files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging
          cp -a src/. staging/
          cp "cache/${{ matrix.arch }}/AdGuardHome/AdGuardHome" "staging/bin/AdGuardHome"

      # module.prop is kept identical to upstream in git so that picking changes
      # up from twoone-3 never conflicts; the name and update URL go in here.
      - name: Brand build
        shell: bash
        run: ./brand.sh staging "${{ needs.decide.outputs.version }}"

      - name: Create zip package
        shell: bash
        run: |
          set -euo pipefail
          rm -f "AdGuardHomeForRoot_${{ matrix.arch }}.zip"
          (
            cd staging
            zip -r "../AdGuardHomeForRoot_${{ matrix.arch }}.zip" .
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardHomeForRoot_${{ matrix.arch }}
          path: AdGuardHomeForRoot_${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [decide, package]
    if: needs.decide.outputs.release == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AdGuardHomeForRoot_*
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Built against AdGuardHome **%s**.\n\n' "${{ needs.decide.outputs.agh }}"
            cat changelog.md
          } >"$RUNNER_TEMP/notes.md"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.version }}
          name: ${{ needs.decide.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            AdGuardHomeForRoot_arm64.zip
            AdGuardHomeForRoot_armv7.zip

      # Installed modules poll update.json on main, so the release only becomes
      # visible to them once that file names this tag. Runs last on purpose: it
      # must not advertise a release that failed to publish.
      - name: Publish update manifest
        shell: bash
        env:
          AGH_VERSION: ${{ needs.decide.outputs.agh }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          cp src/module.prop staging/module.prop
          ./brand.sh staging "$VERSION" "$RUNNER_TEMP/update.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/update.json" update.json

          # Staged before comparing: git diff ignores untracked files, so the
          # very first update.json would look unchanged and never be committed.
          git add update.json
          if git diff --cached --quiet -- update.json; then
            echo "update.json already points at $VERSION"
            exit 0
          fi
          git commit -m "chore: point updates at $VERSION (AdGuardHome $AGH_VERSION)"
          git push origin main
