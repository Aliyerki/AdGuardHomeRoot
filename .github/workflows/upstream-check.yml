name: Check upstream

# This repo carries patches on top of twoone-3/AdGuardHomeForRoot but is not a
# GitHub fork, so nothing tells us when that project moves. This asks once a
# week and opens an issue when there is something to sync.

on:
  schedule:
    # Mondays, 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare with upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count new upstream commits
        id: cmp
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/twoone-3/AdGuardHomeForRoot.git
          git fetch -q upstream main

          count="$(git rev-list --count HEAD..upstream/main)"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "Upstream is $count commit(s) ahead"

          {
            echo 'log<<COMMITS_EOF'
            git log --format='- [`%h`](https://github.com/twoone-3/AdGuardHomeForRoot/commit/%H) %s' HEAD..upstream/main
            echo 'COMMITS_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Open or update the sync issue
        if: steps.cmp.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.cmp.outputs.count }}
          COMMITS: ${{ steps.cmp.outputs.log }}
        run: |
          set -euo pipefail
          gh label create upstream-sync \
            --description "Upstream has changes this repo has not picked up" \
            --color 0e8a16 --force

          # Built with printf rather than a heredoc: heredoc bodies have to start
          # at column 0, and a line less indented than the run block ends the
          # YAML block scalar, which silently breaks the whole workflow file.
          today="$(date -u +%Y%m%d)"
          {
            printf 'Upstream (`twoone-3/AdGuardHomeForRoot`) is **%s commit(s)** ahead of this repo.\n\n' "$COUNT"
            printf '%s\n\n' "$COMMITS"
            printf 'To pick them up:\n\n'
            printf '```bash\n'
            printf './sync-upstream.sh           # rebases the fork patches, stops on conflict\n'
            printf './sync-upstream.sh --push\n'
            printf 'git tag %s && git push origin %s\n' "$today" "$today"
            printf '```\n\n'
            printf 'The tag builds and publishes the release, and points `update.json` at it.\n'
          } >"$RUNNER_TEMP/body.md"

          existing="$(gh issue list --label upstream-sync --state open --json number -q '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updating issue #$existing"
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create \
              --title "Upstream is $COUNT commit(s) ahead" \
              --label upstream-sync \
              --body-file "$RUNNER_TEMP/body.md"
          fi
